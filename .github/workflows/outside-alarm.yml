# TEMPLATE (T-014/T-304 option A, T-307, T-309). Lives in the separate public repo ArielSoothy/hakolagents-alarm as
# .github/workflows/outside-alarm.yml. Kept here outside .github/workflows so it never runs in this private repo.
# Reads only the public health page; never logs response bodies, the bot token or the Telegram URL.
# The Mac heartbeat watches this workflow (OUTSIDE_ALARM_STALE when no scheduled run for 3 hours).
# Pages once per problem: a scheduled run whose previous scheduled run also failed stays quiet, except one
# reminder per 6 hours of the failing streak; the first OK scheduled run after a failure sends one 'recovered'.
# T-309: after a delivered scheduled page, request a diagnose-only cloud helper through a GitHub release.
name: HaKol outside alarm
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send one TEST Telegram message and exit (no health check)'
        type: boolean
        default: false
      test_fallback:
        description: 'Request the cloud helper once with a TEST release (no health check)'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: outside-alarm
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      wake_reason: ${{ steps.health.outputs.wake_reason }}
      wake_codes: ${{ steps.health.outputs.wake_codes }}
    # Two 15 s reads + the 20-minute confirmation wait + history and Telegram page.
    timeout-minutes: 30
    steps:
      - name: Check the public health summary
        id: health
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
          TEST_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.test_fallback }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const send=async text=>{
            const token=process.env.TELEGRAM_BOT_TOKEN,chat=process.env.TELEGRAM_CHAT_ID;
            if(!token||!chat){console.error('OUTSIDE_ALARM_TELEGRAM_NOT_CONFIGURED');return false;}
            try {
              const sent=await fetch('https://api.telegram.org/bot'+token+'/sendMessage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_id:chat,text}),signal:AbortSignal.timeout(10000),redirect:'error'});
              await sent.body?.cancel();
              if(!sent.ok){console.error('OUTSIDE_ALARM_TELEGRAM_FAILED');return false;}
              return true;
            } catch { console.error('OUTSIDE_ALARM_TELEGRAM_FAILED'); return false; }
          };
          if(process.env.TEST_ALERT==='true'){
            const ok=await send('TEST — HaKol outside alarm works');
            console.log(ok?'OUTSIDE_ALARM_TEST_SENT':'OUTSIDE_ALARM_TEST_NOT_SENT');
            process.exit(ok?0:1);
          }
          const wake=(reason,codes)=>{
            if(!/^(mac_absent|red_streak|test)$/.test(reason)||codes.length<1||codes.length>10||
              !codes.every(code=>/^(TEST|SITE_UNREACHABLE|SITE_RED|ROBOT_SILENT|ROBOT_UNKNOWN|MAC_SILENT|JOB_OVERDUE:[A-Za-z0-9_-]{1,40})$/.test(code)))return;
            appendFileSync(process.env.GITHUB_OUTPUT,`wake_reason=${reason}\nwake_codes=${codes.join(',')}\n`);
          };
          if(process.env.GITHUB_EVENT_NAME==='workflow_dispatch'&&process.env.TEST_FALLBACK==='true'){
            wake('test',['TEST']);
            process.exit(0);
          }
          const age=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0?value:null;
          const check=async()=>{
            const problems=[];
            let data=null;
            try {
              const response=await fetch('https://hakolagents.com/api/callit/health/summary',{signal:AbortSignal.timeout(15000),redirect:'error',cache:'no-store'});
              // 503 is the documented RED reply and still carries the JSON summary.
              data=await response.json();
              if(!data||typeof data!=='object'||Array.isArray(data)||!Array.isArray(data.jobs))data=null;
            } catch { /* No response bodies, URLs or error text are logged. */ }
            if(!data)return ['SITE_UNREACHABLE (health page unreachable or not JSON)'];
            // A robot that runs but fails every journey is never overdue: RED / ok:false is a failure on its own.
            if(data.ok!==true||data.state==='RED')problems.push(`SITE_RED (site health is ${data.state==='YELLOW'||data.state==='GREEN'?data.state:'RED'}, ok=${data.ok===true})`);
            const robot=age(data.robot_age_s);
            if(robot===null)problems.push('ROBOT_UNKNOWN (robot heartbeat age missing)');
            else if(robot>2700)problems.push(`ROBOT_SILENT (robot last ran ${Math.round(robot/60)} min ago)`);
            const mac=age(data.mac_age_s);
            if(mac!==null&&mac>3600)problems.push(`MAC_SILENT (the Mac last checked in ${Math.round(mac/60)} min ago — asleep, off or stuck?)`);
            const overdue=data.jobs.filter(job=>job&&job.overdue===true).map(job=>String(job.name).replace(/[^a-z0-9_-]/gi,'').slice(0,40));
            for(const name of overdue)problems.push(`JOB_OVERDUE:${name}`);
            return problems;
          };
          // Earlier completed scheduled runs of this workflow, newest first; null when unreadable.
          const history=async()=>{
            const token=process.env.GITHUB_TOKEN,repo=process.env.GITHUB_REPOSITORY,api=process.env.GITHUB_API_URL||'https://api.github.com';
            if(!token||!repo||!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo))return null;
            try {
              const response=await fetch(`${api}/repos/${repo}/actions/workflows/outside-alarm.yml/runs?event=schedule&status=completed&per_page=100`,{headers:{authorization:'Bearer '+token,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'},signal:AbortSignal.timeout(10000),redirect:'error'});
              if(!response.ok){await response.body?.cancel();return null;}
              const runs=(await response.json())?.workflow_runs;
              if(!Array.isArray(runs))return null;
              const current=String(process.env.GITHUB_RUN_ID??'');
              return runs.filter(r=>r&&r.event==='schedule'&&r.status==='completed'&&String(r.id)!==current&&Number.isFinite(Date.parse(r.created_at)))
                .map(r=>({at:Date.parse(r.created_at),failed:['failure','timed_out','startup_failure'].includes(r.conclusion),ok:r.conclusion==='success'}))
                .filter(r=>r.failed||r.ok).sort((a,b)=>b.at-a.at);
            } catch { return null; }
          };
          const SIX_HOURS=6*3600000,scheduled=process.env.GITHUB_EVENT_NAME==='schedule';
          let problems=await check();
          if(problems.length){
            // One bad read is not an outage. The :17 read and a :19 re-read would both see the same :15 ingest,
            // so wait 20 minutes (past the next ingest) and read again; page only on the second read's reasons.
            console.log('OUTSIDE_ALARM_RECHECK first read failed; confirming in 20 min');
            await new Promise(resolve=>setTimeout(resolve,Number(process.env.OUTSIDE_ALARM_CONFIRM_MS??1200000)));
            problems=await check();
          }
          if(problems.length){
            for(const line of problems)console.error('OUTSIDE_ALARM_FAILED '+line);
            process.exitCode=1;
            // Once per problem: skip when the previous scheduled run also failed, except one reminder per 6 hours
            // of the failing streak. Manual runs and an unreadable history always send.
            const runs=scheduled?await history():null;
            let reminder=false;
            let heading='HaKol OUTSIDE ALARM (GitHub, independent of the Mac; confirmed on a second read 20 min later):';
            if(runs&&runs[0]?.failed){
              let start=runs[0].at,ended=false;
              for(const run of runs){if(run.ok){ended=true;break;}start=run.at;}
              const now=Date.now();
              // A streak longer than the 100-run page has no known start: fall back to fixed 6-hour UTC blocks.
              const remind=ended?Math.floor((now-start)/SIX_HOURS)>Math.floor((runs[0].at-start)/SIX_HOURS):Math.floor(now/SIX_HOURS)>Math.floor(runs[0].at/SIX_HOURS);
              if(!remind){console.log('OUTSIDE_ALARM_ALREADY_PAGED previous scheduled run also failed; no message');process.exit(1);}
              heading=`HaKol OUTSIDE ALARM — still failing (reminder; failing since ${new Date(start).toISOString().slice(0,16)}Z):`;
              console.log('OUTSIDE_ALARM_REMINDER');
              reminder=true;
            }else if(scheduled&&!runs)console.log('OUTSIDE_ALARM_HISTORY_UNKNOWN sending anyway');
            const paged=await send([heading,...problems.map(line=>'- '+line),'Public page: hakolagents.com/api/callit/health/summary'].join('\n'));
            if(scheduled&&paged){
              const codes=problems.map(line=>line.split(' ')[0]).filter(code=>/^(SITE_UNREACHABLE|SITE_RED|ROBOT_SILENT|ROBOT_UNKNOWN|MAC_SILENT|JOB_OVERDUE:[A-Za-z0-9_-]{1,40})$/.test(code)).slice(0,10);
              const reason=codes.includes('MAC_SILENT')||codes.includes('SITE_UNREACHABLE')?'mac_absent':reminder&&codes.includes('SITE_RED')?'red_streak':null;
              if(reason){
                wake(reason,codes);
              }else console.log('OUTSIDE_ALARM_FALLBACK_SKIPPED_MAC_ALIVE');
            }
          } else {
            console.log('OUTSIDE_ALARM_OK');
            // One 'recovered' message on the first OK scheduled run after a failed one; unknown history sends nothing.
            const runs=scheduled?await history():null;
            if(runs&&runs[0]?.failed){
              await send('HaKol outside alarm: recovered — the public health check is OK again.');
              console.log('OUTSIDE_ALARM_RECOVERED_SENT');
            }
          }
          NODE
  wake:
    needs: check
    if: always() && needs.check.outputs.wake_reason != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Request the cloud helper through a release
        env:
          WAKE_REASON: ${{ needs.check.outputs.wake_reason }}
          WAKE_CODES: ${{ needs.check.outputs.wake_codes }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const reason=process.env.WAKE_REASON,codes=process.env.WAKE_CODES;
          if(!/^(mac_absent|red_streak|test)$/.test(reason??'')||!/^[A-Za-z0-9_:,-]{1,600}$/.test(codes??'')){
            console.error('OUTSIDE_ALARM_WAKE_BAD_INPUT');process.exit(1);
          }
          const send=async text=>{
            const token=process.env.TELEGRAM_BOT_TOKEN,chat=process.env.TELEGRAM_CHAT_ID;
            if(!token||!chat){console.error('OUTSIDE_ALARM_TELEGRAM_NOT_CONFIGURED');return false;}
            try {
              const sent=await fetch('https://api.telegram.org/bot'+token+'/sendMessage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_id:chat,text}),signal:AbortSignal.timeout(10000),redirect:'error'});
              await sent.body?.cancel();
              if(!sent.ok){console.error('OUTSIDE_ALARM_TELEGRAM_FAILED');return false;}
              return true;
            } catch {console.error('OUTSIDE_ALARM_TELEGRAM_FAILED');return false;}
          };
          const base=`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers={authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','content-type':'application/json'};
          const request=(path,options={})=>fetch(base+path,{...options,headers,signal:AbortSignal.timeout(15000),redirect:'error'});
          const tag=`fallback-${process.env.GITHUB_RUN_ID}-${Math.floor(Date.now()/1000)}-${reason}`;
          const line=`HAKOL_FALLBACK v1 reason=${reason} codes=${codes} run=${process.env.GITHUB_RUN_ID}`;
          let status='NETWORK',created=false;
          try {
            const response=await request('/releases',{method:'POST',body:JSON.stringify({tag_name:tag,target_commitish:process.env.GITHUB_SHA,name:line,body:line,draft:false,prerelease:true,make_latest:'false'})});
            status=String(response.status);created=response.status===201;
            await response.body?.cancel();
          } catch { /* Never log response bodies, tokens or error text. */ }
          if(created){
            console.log('OUTSIDE_ALARM_WAKE_REQUESTED');
            const sent=await send(reason==='test'?'TEST — cloud helper wake requested':`Cloud helper wake requested (${reason}). Its report is due in ~15 min in the Claude doc 'HaKol Agents — daily operator log'; no report means it did not start.`);
            if(!sent)process.exitCode=1;
          }else{
            console.error('OUTSIDE_ALARM_WAKE_FAILED_'+status);
            await send(`Cloud helper could not be woken (${status}). You are the only operator now — see RUNBOOK-jobs.md 'Cloud fallback'.`);
            process.exitCode=1;
          }
          // Best effort, bounded to the newest 100 releases. Never delete another release family.
          try {
            const response=await request('/releases?per_page=100');
            if(!response.ok){await response.body?.cancel();throw new Error('cleanup');}
            const releases=await response.json();
            if(!Array.isArray(releases))throw new Error('cleanup');
            const fallback=releases.filter(r=>r&&typeof r.tag_name==='string'&&r.tag_name.startsWith('fallback-'));
            if(fallback.some(r=>!Number.isSafeInteger(r.id)||r.id<=0||!Number.isFinite(Date.parse(r.created_at))))throw new Error('cleanup');
            fallback.sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)||b.id-a.id);
            for(const release of fallback.slice(20)){
              for(const path of [`/releases/${release.id}`,`/git/refs/tags/${encodeURIComponent(release.tag_name)}`]){
                try {
                  const removed=await request(path,{method:'DELETE'});
                  await removed.body?.cancel();
                  if(!removed.ok)console.error('OUTSIDE_ALARM_WAKE_CLEANUP_FAILED');
                } catch {console.error('OUTSIDE_ALARM_WAKE_CLEANUP_FAILED');}
              }
            }
          } catch {console.error('OUTSIDE_ALARM_WAKE_CLEANUP_FAILED');}
          NODE
